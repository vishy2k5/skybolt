[project]
name = "skybolt"
version = "0.1.0"
description = "DIY smart wall calendar"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "pillow>=11",
    "python-dateutil>=2.9",
    "uvicorn>=0.30",
]

[project.scripts]
skybolt = "skybolt.main:run"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/skybolt"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
