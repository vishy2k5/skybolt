<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Skybolt</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#101a2e">
<link rel="stylesheet" href="/style.css">
</head><body>
<div id="app">
  <header id="top">
    <img id="logo" src="/icon.svg" alt="Skybolt" width="42" height="42">
    <div id="clock"><div id="time"></div><div id="date"></div></div>
    <button id="wx-chip" aria-label="Open weather"></button>
    <div class="spacer"></div>
    <nav id="views">
      <button data-view="day">Day</button><button data-view="week">Week</button><button data-view="month">Month</button>
    </nav>
    <button id="chores-btn">✓ Chores<span class="badge" hidden></span></button>
    <button id="shop-btn" aria-label="Shopping lists"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM1 2v2h2l3.6 7.6-1.35 2.45c-.16.28-.25.61-.25.95a2 2 0 0 0 2 2h12v-2H7.42a.25.25 0 0 1-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 20 4H5.21l-.94-2H1zm16 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg><span class="badge" hidden></span></button>
    <button id="ss-btn" aria-label="Start screensaver" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a.7.7 0 0 0-.9-.9A10 10 0 1 0 21.4 15.5a.7.7 0 0 0-.9-.9z"/></svg></button>
    <button id="gear-btn" aria-label="Settings">⚙</button>
    <button id="add-btn" class="primary" aria-label="Add event">+</button>
  </header>
  <div id="sub">
    <button id="prev" aria-label="Previous">‹</button>
    <button id="next" aria-label="Next">›</button>
    <h2 id="range"></h2>
    <button id="today">Today</button>
  </div>
  <main id="cal"></main>
</div>
<div id="overlay"></div>
<script type="module" src="/js/main.js"></script>
</body></html>
